[package]
name = "kazma-engine"
version = "0.1.0"
edition = "2021"
description = "Kazma motoru: kurulum, başlatma, mod eşitleme. Arayüzden bağımsız, ilerleme bir Reporter ile bildirilir."

[dependencies]
kazma-core = { path = "../kazma-core" }
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
url = "2"
base64 = "0.22"
