[package]
name = "kazma"
version = "0.1.0"
edition = "2021"
description = "Kazma Launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
kazma-engine = { path = "../crates/kazma-engine" }

[features]
# `cargo build --release --features custom-protocol` arayüz dosyalarını exe'ye gömer.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
