[package]
name = "kazma-core"
version = "0.1.0"
edition = "2021"
description = "Kazma Launcher çekirdeği: sürüm manifesti, mod eşitleme planı, doğrulama"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
thiserror = "1"
url = "2"
ed25519-dalek = "2"
flate2 = "1"
base64 = "0.22"
