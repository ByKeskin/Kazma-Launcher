name: Windows derleme
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - name: Testler
        run: cargo test --workspace
      - name: Komut satırı aracı
        run: cargo build -p kazma-cli --release
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Uygulama ve kurulum sihirbazı (NSIS)
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis
      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src-tauri/target/release/kazma.exe dist/Kazma.exe
          Copy-Item target/release/kazma-cli.exe dist/
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist/Kazma-Kurulum.exe
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: kazma-windows
          path: dist
      - name: Sürüm yayınla (v ile başlayan etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Kazma-Kurulum.exe dist/Kazma.exe --title "Kazma Launcher ${{ github.ref_name }}" --notes "Kurulum için Kazma-Kurulum.exe dosyasını indirip çalıştır. Windows 'Bilgisayarınızı korudu' derse: Ek bilgi, Yine de çalıştır." 
