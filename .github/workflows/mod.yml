name: Kazma Tema modu
on:
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Çizim mantığı testi (oyun gerektirmez)
        working-directory: mod
        run: |
          javac -d /tmp/fx src/main/java/app/kazma/theme/fx/*.java tools/FxCheck.java
          java -cp /tmp/fx FxCheck
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Modu derle
        working-directory: mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kazma-theme-mod
          path: |
            mod/build/libs/kazma-theme-*.jar
            !mod/build/libs/*-sources.jar
      - name: Launcher için yayınla (mod-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls mod/build/libs/kazma-theme-*.jar | grep -v sources | head -1)
          cp "$JAR" kazma-theme.jar
          sha256sum kazma-theme.jar | cut -d' ' -f1 > kazma-theme.jar.sha256
          gh release view mod-latest >/dev/null 2>&1 || gh release create mod-latest --prerelease --title "Kazma Tema modu (otomatik)" --notes "Launcher bu dosyayı otomatik indirir; elle kurman gerekmez."
          gh release upload mod-latest kazma-theme.jar kazma-theme.jar.sha256 --clobber
